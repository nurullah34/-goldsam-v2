<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>V2 Sinyaller — GoldSam V2</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0a0a0a;color:#e5e5e5;min-height:100vh}
.container{max-width:1400px;margin:0 auto;padding:24px}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px solid #2d2d2d;margin-bottom:24px}
h1{font-size:24px;color:#facc15}
.badge{display:inline-block;padding:3px 8px;background:#ca8a04;color:#fff;border-radius:4px;font-size:11px;font-weight:700;margin-left:8px}
.status-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;background:#1a1a1a;border:1px solid #2d2d2d;border-radius:20px;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 6px #4ade80;animation:pulse 2s infinite}
.dot.off{background:#666;box-shadow:none;animation:none}
@keyframes pulse{50%{opacity:.5}}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:24px}
.stat-card{background:#161616;border:1px solid #2d2d2d;border-radius:8px;padding:16px}
.stat-label{font-size:12px;color:#888;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.stat-value{font-size:24px;font-weight:700;color:#facc15}
.stat-value.green{color:#4ade80}
.stat-value.red{color:#f87171}

.tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid #2d2d2d;padding-bottom:0}
.tab{padding:10px 16px;background:none;border:none;color:#888;cursor:pointer;font-size:14px;border-bottom:2px solid transparent;transition:all .2s}
.tab:hover{color:#facc15}
.tab.active{color:#facc15;border-bottom-color:#facc15}

table{width:100%;border-collapse:collapse;background:#161616;border-radius:8px;overflow:hidden}
th{text-align:left;padding:10px 14px;background:#1f1f1f;color:#888;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #2d2d2d}
td{padding:10px 14px;border-bottom:1px solid #1f1f1f;font-size:13px}
tr:hover{background:#1a1a1a}
.side-buy{color:#4ade80;font-weight:600}
.side-sell{color:#f87171;font-weight:600}
.strategy{background:#2d2d2d;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;display:inline-block}
.muted{color:#666}
.empty{text-align:center;padding:40px;color:#666;background:#161616;border-radius:8px}
.refresh{font-size:11px;color:#666;margin-left:auto}

footer{margin-top:48px;padding-top:24px;border-top:1px solid #2d2d2d;text-align:center;color:#666;font-size:12px}
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1>GoldSam <span class="badge">V2 SİNYALLER</span></h1>
      <p style="color:#888;margin-top:4px;font-size:13px">VPS-V2-PROD — 6 strateji canlı taranıyor</p>
    </div>
    <div class="status-pill" id="status">
      <span class="dot" id="status-dot"></span>
      <span id="status-text">Bağlanıyor...</span>
    </div>
  </header>

  <div class="stats">
    <div class="stat-card"><div class="stat-label">Toplam Sinyal</div><div class="stat-value" id="stat-total">0</div></div>
    <div class="stat-card"><div class="stat-label">Bugün</div><div class="stat-value" id="stat-today">0</div></div>
    <div class="stat-card"><div class="stat-label">TP (✓)</div><div class="stat-value green" id="stat-tp">0</div></div>
    <div class="stat-card"><div class="stat-label">SL (✗)</div><div class="stat-value red" id="stat-sl">0</div></div>
    <div class="stat-card"><div class="stat-label">Win Rate</div><div class="stat-value" id="stat-wr">—</div></div>
    <div class="stat-card"><div class="stat-label">Açık</div><div class="stat-value" id="stat-open" style="color:#aaa">0</div></div>
  </div>

  <div class="tabs">
    <button class="tab active" data-filter="all">Hepsi</button>
    <button class="tab" data-filter="8T LONG">8T LONG</button>
    <button class="tab" data-filter="8T SHORT">8T SHORT</button>
    <button class="tab" data-filter="MULTI100">MULTI100</button>
    <button class="tab" data-filter="MICRO-S">MICRO-S</button>
    <button class="tab" data-filter="GOLDS">GOLDS</button>
    <button class="tab" data-filter="GENIS">GENIS</button>
    <span class="refresh" id="refresh-info">⟳ 5sn'de bir yenilenir</span>
  </div>

  <table>
    <thead>
      <tr>
        <th style="width:60px">#</th>
        <th>Strateji</th>
        <th>Yön</th>
        <th>Sembol</th>
        <th>Entry</th>
        <th>Sonuç</th>
        <th>Magic</th>
        <th>Zaman</th>
      </tr>
    </thead>
    <tbody id="rows">
      <tr><td colspan="8" class="empty">Yükleniyor...</td></tr>
    </tbody>
  </table>

  <footer>GoldSam V2 — Otomatik Altın Sinyal Sistemi · VPS Master · 6 strateji</footer>
</div>

<script>
let currentFilter = "all";
let allSignals = [];

async function fetchData() {
  try {
    const [statusRes, sigRes, statsRes] = await Promise.all([
      fetch("/public/status"),
      fetch("/public/signals/recent?limit=500"),
      fetch("/public/signals/stats?hours=168"),
    ]);
    const status = await statusRes.json();
    const sigs = await sigRes.json();
    const stats = await statsRes.json();
    updateStatus(status);
    allSignals = sigs.signals || [];
    updateStats(stats);
    render();
  } catch (e) {
    document.getElementById("status-dot").classList.add("off");
    document.getElementById("status-text").textContent = "OFFLINE";
  }
}

function updateStats(s) {
  document.getElementById("stat-tp").textContent = s.tp || 0;
  document.getElementById("stat-sl").textContent = s.sl || 0;
  document.getElementById("stat-open").textContent = s.open || 0;
  const wr = s.win_rate;
  const wrEl = document.getElementById("stat-wr");
  if (wr === null || wr === undefined) {
    wrEl.textContent = "—";
    wrEl.style.color = "#aaa";
  } else {
    wrEl.textContent = wr.toFixed(1) + "%";
    wrEl.style.color = wr >= 60 ? "#4ade80" : wr >= 40 ? "#fbbf24" : "#f87171";
  }
}

function updateStatus(s) {
  const eng = s.engine || {};
  const ok = eng.running && eng.mt5_ok;
  const dot = document.getElementById("status-dot");
  dot.classList.toggle("off", !ok);
  document.getElementById("status-text").textContent =
    ok ? `ONLINE · ${eng.symbol}` : "OFFLINE";
  document.getElementById("stat-strats").textContent = eng.strategies || 0;
}

function render() {
  const tbody = document.getElementById("rows");
  let list = allSignals;
  if (currentFilter !== "all") {
    list = allSignals.filter(s => (s.strategy || "").startsWith(currentFilter));
  }
  document.getElementById("stat-total").textContent = allSignals.length;
  const today = new Date().toISOString().slice(0, 10);
  const todayCount = allSignals.filter(s => (s.created_at || "").startsWith(today)).length;
  document.getElementById("stat-today").textContent = todayCount;

  if (list.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="empty">Bu filtrede sinyal yok.</td></tr>';
    return;
  }
  tbody.innerHTML = list.map(s => {
    const entry = s.entry_price ? Number(s.entry_price).toFixed(2) : '—';
    const out = s.outcome;
    let outcomeHtml;
    if (out === 'tp') {
      outcomeHtml = '<span style="color:#4ade80;font-weight:600">✓ TP</span>';
    } else if (out === 'sl') {
      outcomeHtml = '<span style="color:#f87171;font-weight:600">✗ SL</span>';
    } else if (out === 'expired') {
      outcomeHtml = '<span style="color:#9ca3af">⊘ Süre</span>';
    } else {
      outcomeHtml = '<span style="color:#a3a3a3">⏳ Açık</span>';
    }
    return `
    <tr>
      <td class="muted">#${s.id}</td>
      <td><span class="strategy">${escapeHtml(s.strategy || "")}</span></td>
      <td class="${s.side === 'buy' ? 'side-buy' : 'side-sell'}">${s.side === 'buy' ? '▲ BUY' : '▼ SELL'}</td>
      <td>${escapeHtml(s.symbol || "")}</td>
      <td style="font-family:monospace;color:#e5e5e5">${entry}</td>
      <td>${outcomeHtml}</td>
      <td class="muted">${s.magic || 0}</td>
      <td class="muted">${(s.created_at || "").replace("T", " ")}</td>
    </tr>
  `;}).join("");
}

function escapeHtml(s) {
  return String(s).replace(/[<>&"]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
}

document.querySelectorAll(".tab").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentFilter = btn.dataset.filter;
    render();
  });
});

fetchData();
setInterval(fetchData, 5000);
</script>
</body>
</html>
